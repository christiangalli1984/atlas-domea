name: Deploy Edge Functions

# Ogni modifica alle funzioni che finisce su main viene pubblicata in produzione.
# Solo su push: le PR provenienti da fork non possono accedere ai secret.
on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: # permette di lanciarlo a mano dal sito o dall'app GitHub

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy delle funzioni
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      # Rete di sicurezza: se la pagina disponibilità non risponde più,
      # il deploy risulta fallito (pallino rosso su GitHub) e ce ne accorgiamo.
      - name: Verifica che la pagina disponibilità risponda
        run: |
          URL="https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1/disponibilita?format=json"
          for i in 1 2 3; do
            CODE=$(curl -sS -o /tmp/out.json -w "%{http_code}" --max-time 40 "$URL" || echo "000")
            echo "tentativo $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              head -c 200 /tmp/out.json
              echo ""
              echo "OK: la funzione risponde correttamente."
              exit 0
            fi
            sleep 10
          done
          echo "ERRORE: dopo il deploy la funzione non risponde (ultimo codice: $CODE)."
          exit 1
